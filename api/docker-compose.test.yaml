services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: course_app_test
      POSTGRES_PASSWORD: course_app_test
      POSTGRES_DB: course_app_test
    ports:
      - "5433:5432"
    # `up --wait` blocks on this. `-h 127.0.0.1` forces a TCP connection: the
    # temporary server Postgres runs while initialising a fresh volume only
    # listens on the Unix socket, so a socket check would pass too early.
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "course_app_test",
          "-d",
          "course_app_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  # Stripe's official mock API server. It checks requests against Stripe's API
  # spec and returns canned responses, so e2e tests run the real SDK over real
  # HTTP without a Stripe account. Keep the version in step with the stripe SDK.
  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    ports:
      - "12111:12111"
