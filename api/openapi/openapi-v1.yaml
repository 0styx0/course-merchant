openapi: 3.1.0

info:
  title: Course Merchant API
  version: 1.0.0
  description: API for browsing and purchasing courses.

servers:
  - url: http://localhost:3000/v1
    description: Local development server

# These operations are public. Declared explicitly so the intent is visible.
security: []

tags:
  - name: Courses
    description: Public course operations

paths:
  /courses:
    get:
      tags:
        - Courses
      operationId: listCourses
      summary: List available courses
      description: >
        Returns courses that have not ended, ordered by start time ascending.
        Courses that have been archived or do not have an effective price are
        not returned.
      responses:
        "200":
          description: Successfully retrieved available courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCoursesResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /courses/{courseId}:
    get:
      tags:
        - Courses
      operationId: getCourse
      summary: Get a course
      description: >
        Returns a course that has not been archived and has an effective price.
        Unlike `listCourses`, ended courses are still returned. An unknown or
        malformed identifier results in a 404.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Successfully retrieved the course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCourseResponse"
        "404":
          $ref: "#/components/responses/CourseNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      description: Public identifier of the course.
      schema:
        type: string
        minLength: 1
        examples:
          - crs_01HZX3

  responses:
    CourseNotFound:
      description: Course not found, archived, or does not have an effective price.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                message: Course not found
                code: COURSE_NOT_FOUND

    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internalServerError:
              value:
                message: Internal server error
                code: INTERNAL_SERVER_ERROR

  schemas:
    ListCoursesResponse:
      type: object
      required:
        - courses
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
      additionalProperties: false

    Course:
      type: object
      required:
        - id
        - name
        - description
        - enrollmentCount
        - price
        - schedule
      properties:
        id:
          type: string
          minLength: 1
          description: Public identifier of the course.
          examples:
            - crs_01HZX3

        name:
          type: string
          description: Public name of the course.
          minLength: 1
          examples:
            - React Fundamentals

        description:
          type: string
          description: Public description of the course.
          minLength: 1
          examples:
            - Learn the fundamentals of React.

        enrollmentCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of users currently enrolled in the course.
          examples:
            - 12

        price:
          $ref: "#/components/schemas/Price"

        schedule:
          $ref: "#/components/schemas/CourseSchedule"

      additionalProperties: false

    GetCourseResponse:
      $ref: "#/components/schemas/Course"

    Price:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: >
            Price in the smallest unit of the currency. For USD, 9900
            represents $99.00.
          examples:
            - 9900

        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: "^[A-Z]{3}$"
          examples:
            - USD

      additionalProperties: false

    CourseSchedule:
      type: object
      required:
        - startTime
        - endTime
        - timeZone
      properties:
        startTime:
          type: string
          format: date-time
          description: >
            Course start time as an RFC 3339 date-time including its UTC offset.
          examples:
            - "2026-10-01T18:00:00-04:00"

        endTime:
          type: string
          format: date-time
          description: >
            Course end time as an RFC 3339 date-time including its UTC offset.
            Always after `startTime`.
          examples:
            - "2026-10-01T20:00:00-04:00"

        timeZone:
          type: string
          description: >
            IANA time zone identifier the course is held in. Use this, rather
            than the UTC offset in `startTime` and `endTime`, to display local
            times correctly across daylight saving changes.
          examples:
            - America/New_York

      additionalProperties: false

    ErrorResponse:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
          description: Human-readable description of the error.

        code:
          type: string
          enum:
            - COURSE_NOT_FOUND
            - INTERNAL_SERVER_ERROR
          description: Stable machine-readable error code. Clients should branch on this rather than on message.

      additionalProperties: false
