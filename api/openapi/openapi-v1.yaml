openapi: 3.1.0

info:
  title: Course Merchant API
  version: 1.1.0
  description: API for browsing, creating, and purchasing courses.

servers:
  - url: http://localhost:3000/v1
    description: Local development server

# Operations are public unless they declare their own `security`.
security: []

tags:
  - name: Courses
    description: Public course operations
  - name: Admin
    description: Administrator-only operations

paths:
  /courses:
    get:
      tags:
        - Courses
      operationId: listCourses
      summary: List available courses
      description: >
        Returns publicly viewable courses that have not ended, ordered by start
        time ascending. A course is publicly viewable when its `status` is
        `published` and it has a currently active price. Archived courses and
        courses without a currently active price are not returned. A course
        whose prices all take effect in the future is hidden until the
        earliest `effectiveAt` is reached.
      responses:
        "200":
          description: Successfully retrieved available courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCoursesResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /courses/{courseId}:
    get:
      tags:
        - Courses
      operationId: getCourse
      summary: Get a course
      description: >
        Returns a course that is publicly viewable: its `status` is `published`
        and it has a currently active price. Unlike `listCourses`, ended courses
        are still returned. An archived course returns 404, as does a course
        whose prices all take effect in the future until the earliest
        `effectiveAt` is reached.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Successfully retrieved the course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/InvalidCourseId"
        "404":
          $ref: "#/components/responses/CourseNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/courses:
    get:
      tags:
        - Admin
      operationId: listCoursesAsAdmin
      summary: List all courses as an administrator
      description: >
        Returns every course with its full price schedule. Requires an
        administrator.


        Unlike `listCourses`, nothing is filtered out: ended courses,
        archived courses, and courses without a currently active price
        (including those whose prices all take effect in the future) are all
        included. Courses are ordered by `schedule.startTime` descending,
        so the most recent and upcoming courses come first. Each course is in
        the same representation as `getCourseAsAdmin`, including its `status`.


        The response is not paginated.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully retrieved all courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminCoursesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Admin
      operationId: createCourse
      summary: Create a course
      description: >
        Creates a course. Requires an administrator.


        All fields are required. The server validates every
        field and reports all failures at once in the `errors` array of a 400
        response, so clients can display every problem together.


        Validation rules:

        - `name`: 1 to 100 characters.

        - `description`: 1 to 5,000 characters.

        - `schedule.timeZone`: must be a valid IANA time zone identifier.

        - `schedule.startTime`: must be an RFC 3339 date-time with a UTC
        offset, and must be now or in the future.

        - `schedule.endTime`: must be an RFC 3339 date-time with a UTC offset,
        in the future, and after `startTime`.

        - `schedule.startTime` and `schedule.endTime`: the UTC offset must
        match the offset `timeZone` observes at that instant. For example,
        `2026-07-01T18:00:00-05:00` is rejected for `America/New_York`, which
        is at -04:00 in July. A local time skipped by a daylight saving change
        cannot match any offset and is rejected the same way.

        - `prices`: at least one entry, and no two entries may share the same
        `effectiveAt`.

        - `prices[].currency`: must be an existing ISO 4217 currency code.

        - `prices[].amount`: must be at least 50 (fifty cents for USD), because
        the payment processor does not accept smaller charges.

        - `prices[].effectiveAt`: must be now or in the future.

        - `status`: see #/components/schemas/CourseStatus


        A course is publicly visible only when its `status` is `published` and
        a price is in effect. If every entry in `prices` has a future
        `effectiveAt`, the course is hidden from `listCourses` and `getCourse`
        until the earliest `effectiveAt`. Include a price with an `effectiveAt`
        of now to make the course visible immediately. Create a course with
        `status: archived` to keep it hidden, regardless of its prices, until
        it is published.


        The response is the same representation returned by
        `getCourseAsAdmin`: `prices` contains the full schedule, each entry
        with a generated `id`, ordered by `effectiveAt` ascending. Public
        course responses (`listCourses`, `getCourse`) instead return a single
        `price`, the currently active price, without `effectiveAt`.


        Send an `Idempotency-Key` header to make retries safe. Retrying a
        request with the same key and the same body returns the original
        response instead of creating another course. Reusing a key with a
        different body returns 422, and retrying while the original request is
        still being processed returns 409. Keys are scoped to the authenticated
        user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
            examples:
              reactFundamentals:
                value:
                  name: React Fundamentals
                  description: Learn the fundamentals of React.
                  prices:
                    - amount: 7900
                      currency: USD
                      effectiveAt: "2026-10-20T00:00:00-04:00"
                    - amount: 9900
                      currency: USD
                      effectiveAt: "2026-11-15T00:00:00-05:00"
                  schedule:
                    startTime: "2026-12-01T18:00:00-05:00"
                    endTime: "2026-12-01T20:00:00-05:00"
                    timeZone: America/New_York
      responses:
        "201":
          description: >
            Course created. The response is the full administrator view of
            the course, including every entry of the price schedule with its
            `id`.
          headers:
            Location:
              description: URL of the newly created course.
              schema:
                type: string
                format: uri-reference
              examples:
                - /v1/admin/courses/123e4567-e89b-12d3-a456-426614174000
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourse"
              examples:
                reactFundamentals:
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174000
                    name: React Fundamentals
                    description: Learn the fundamentals of React.
                    status: published
                    enrollmentCount: 0
                    prices:
                      - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        amount: 7900
                        currency: USD
                        effectiveAt: "2026-10-20T00:00:00-04:00"
                      - id: 0b7d3f52-3c1a-4a0e-9f0b-5d3f8a6b1c42
                        amount: 9900
                        currency: USD
                        effectiveAt: "2026-11-15T00:00:00-05:00"
                    schedule:
                      startTime: "2026-12-01T18:00:00-05:00"
                      endTime: "2026-12-01T20:00:00-05:00"
                      timeZone: America/New_York
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyKeyInProgress"
        "422":
          $ref: "#/components/responses/IdempotencyKeyReused"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/courses/{courseId}:
    get:
      tags:
        - Admin
      operationId: getCourseAsAdmin
      summary: Get a course as an administrator
      description: >
        Returns a course with its full price schedule. Requires an
        administrator.


        Unlike `getCourse`, this returns the course regardless of whether it
        is publicly visible, including archived courses and courses whose
        prices all take effect in the future. It returns 404 only when no
        course exists with the given ID.


        The response includes the course's `status`. Instead of the single
        currently active `price`, it contains `prices`: every entry in the
        course's price schedule, ordered by
        `effectiveAt` ascending. Each entry has an `id`, and entries whose
        `effectiveAt` has passed are included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Successfully retrieved the course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourse"
        "400":
          $ref: "#/components/responses/InvalidCourseId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AdminCourseNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Admin
      operationId: updateCourse
      summary: Update a course
      description: >
        Replaces a course's details and price schedule. Requires an
        administrator.


        Send the representation returned by `getCourseAsAdmin`, minus
        `enrollmentCount` and the course `id`. Both are read-only and
        ignored if present. Every other field is required. The server
        validates everything and reports all failures at once in the
        `errors` array of a 400 response. The update is atomic: if any
        validation fails, nothing is changed.


        **Details.** `name`, `description` and `schedule` follow the same
        rules as `createCourse`, except that time checks apply only to values
        that changed:

        - `schedule.startTime` must be now or in the future only if it
        differs from the stored value.

        - `schedule.endTime` must be in the future only if it differs from
        the stored value.

        - `endTime` must always be after `startTime`, and each UTC offset
        must always match the offset `timeZone` observes at that instant.


        This lets an admin edit the description of a course that has already
        started. Times are compared as instants, so the same instant written
        with a different UTC offset counts as unchanged.


        **Status.** `status` is required and is set to the value sent. Send
        `archived` to hide the course from the public API, or `published` to
        make it publicly viewable again (once a price is in effect). Status
        can be changed at any time, including on a course with enrollments.


        **Prices.** `prices` is matched against the stored schedule by `id`:

        - An entry with an `id` is matched to the stored entry with that
        `id`. An `id` that does not belong to this course is rejected.

        - An entry without an `id` is created and gets a generated `id`.

        - A stored entry that is omitted from `prices` is deleted.


        An entry is in effect once its stored `effectiveAt` has passed.
        In-effect entries are immutable, so price history cannot be
        rewritten:

        - An in-effect entry must be sent back unchanged (same `id`,
        `amount`, `currency` and `effectiveAt`) and may not be omitted.
        Unchanged in-effect entries skip the "now or in the future" and
        amount checks, so a form can round-trip what it loaded.

        - A new or modified entry must have an `effectiveAt` that is now or
        in the future, plus the usual amount and currency checks.

        - A stored entry that is not yet in effect can be modified or
        omitted freely.

        - `prices` must contain at least one entry, and no two entries may
        share the same `effectiveAt`.


        Whether an entry is in effect is evaluated when the request is
        processed. If a future price takes effect while the form is open,
        resubmitting it unchanged still succeeds, but an edit to it is
        rejected.


        The response is the updated course in the same representation as
        `getCourseAsAdmin`. Price `id`s of unchanged and modified entries are
        preserved, and new entries have generated ones.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
            examples:
              reactFundamentals:
                summary: Keep a past price, change a future one, add a new one
                value:
                  name: React Fundamentals
                  description: Learn the fundamentals of React, with hands-on labs.
                  status: published
                  prices:
                    - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      amount: 6900
                      currency: USD
                      effectiveAt: "2026-09-01T00:00:00-04:00"
                    - id: 0b7d3f52-3c1a-4a0e-9f0b-5d3f8a6b1c42
                      amount: 10900
                      currency: USD
                      effectiveAt: "2026-11-15T00:00:00-05:00"
                    - amount: 11900
                      currency: USD
                      effectiveAt: "2026-11-25T00:00:00-05:00"
                  schedule:
                    startTime: "2026-12-01T18:00:00-05:00"
                    endTime: "2026-12-01T20:00:00-05:00"
                    timeZone: America/New_York
      responses:
        "200":
          description: Course updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AdminCourseNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token for an authenticated administrator.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-generated unique key (a UUID is recommended) that makes the
        request safe to retry. Scoped to the authenticated user.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 8e03978e-40d5-43e8-bc93-6894a57f9324

    CourseId:
      name: courseId
      in: path
      required: true
      description: Public identifier of the course.
      schema:
        $ref: "#/components/schemas/CourseId"

  responses:
    ValidationFailed:
      description: >
        The request body failed validation. `errors` lists every failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetails"
          examples:
            validationFailed:
              value:
                title: Validation failed
                detail: The request contains 2 invalid fields.
                code: VALIDATION_FAILED
                errors:
                  - field: /prices/0/amount
                    code: BELOW_MINIMUM
                    detail: Payment processor requires courses at least fifty cents.
                  - field: /schedule/endTime
                    code: INVALID_RANGE
                    detail: End time must be after start time.
            updateRejected:
              value:
                title: Validation failed
                detail: The request contains 2 invalid fields.
                code: VALIDATION_FAILED
                errors:
                  - field: /prices/0/amount
                    code: IMMUTABLE
                    detail: This price is already in effect and cannot be changed.
                  - field: /prices
                    code: MISSING_ENTRY
                    detail: A price that is already in effect cannot be removed.

    IdempotencyKeyInProgress:
      description: >
        A request with the same `Idempotency-Key` is still being processed.
        Retry after a short delay.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            inProgress:
              value:
                title: Request in progress
                detail: A request with this idempotency key is still being processed.
                code: IDEMPOTENCY_KEY_IN_PROGRESS

    IdempotencyKeyReused:
      description: >
        The `Idempotency-Key` was already used with a different request body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            reused:
              value:
                title: Idempotency key reused
                detail: This idempotency key was already used with a different request.
                code: IDEMPOTENCY_KEY_REUSED

    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unauthorized:
              value:
                title: Unauthorized
                detail: Authentication is required.
                code: UNAUTHORIZED

    Forbidden:
      description: The authenticated user is not an administrator.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            forbidden:
              value:
                title: Forbidden
                detail: Administrator access is required.
                code: FORBIDDEN

    InvalidCourseId:
      description: The course identifier is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            invalidCourseId:
              value:
                title: Invalid course ID
                detail: "'not-a-uuid' is not a valid course identifier."
                code: INVALID_COURSE_ID

    CourseNotFound:
      description: >
        Course not found, archived, or does not have a currently active price
        (including a course whose prices all take effect in the future).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notFound:
              value:
                title: Course not found
                detail: No course exists with ID 123e4567-e89b-12d3-a456-426614174000.
                code: COURSE_NOT_FOUND

    AdminCourseNotFound:
      description: No course exists with the given ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notFound:
              value:
                title: Course not found
                detail: No course exists with ID 123e4567-e89b-12d3-a456-426614174000.
                code: COURSE_NOT_FOUND

    InternalServerError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            internalServerError:
              value:
                title: Internal server error
                code: INTERNAL_SERVER_ERROR
                detail: ""

  schemas:
    CourseId:
      type: string
      format: uuid
      description: Public identifier of the course.
      examples:
        - 123e4567-e89b-12d3-a456-426614174000

    PriceId:
      type: string
      format: uuid
      description: Identifier of an entry in a course's price schedule.
      examples:
        - 7c9e6679-7425-40de-944b-e07fc1f90ae7

    CourseStatusDetails:
      type: object
      required:
        - name
        - changedAt
      properties:
        name:
          $ref: "#/components/schemas/CourseStatus"
        changedAt:
          type: string
          format: date-time
          description: RFC 3339 date-time, including its UTC offset, when the status was last changed.
          examples:
            - "2026-10-15T14:30:00-04:00"

    # append-only log. the one with the most recent changedAt is the courses' current status
    CourseStatus:
      type: string
      enum:
        - published
        - archived
        - drafted
        - deleted
      description: >
        Whether an administrator has made the course available. `published`
        courses are publicly viewable once a price is in effect. `archived`
        courses are hidden from the public API regardless of their prices,
        and can be published again at any time.
      examples:
        - published

    ListCoursesResponse:
      type: object
      required:
        - courses
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"

    ListAdminCoursesResponse:
      type: object
      required:
        - courses
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/AdminCourse"

    CourseName:
      type: string
      minLength: 1
      maxLength: 100
      description: Public name of the course.
      examples:
        - React Fundamentals

    CourseDescription:
      type: string
      minLength: 1
      maxLength: 5000
      description: Public description of the course.
      examples:
        - Learn the fundamentals of React.

    # Fields common to the public and admin representations and to the
    # create and update requests. Validation limits live here once so they
    # cannot drift between operations.
    CourseDetails:
      type: object
      required:
        - name
        - description
        - schedule
      properties:
        name:
          $ref: "#/components/schemas/CourseName"
        description:
          $ref: "#/components/schemas/CourseDescription"
        schedule:
          $ref: "#/components/schemas/CourseSchedule"

    # A price that takes effect at a given time. Shared by every operation that
    # reads or writes a course's price schedule.
    ScheduledPrice:
      description: >
        A `Price` that takes effect at `effectiveAt`, with the additional
        constraint that the amount is at least 50, the payment processor's
        minimum charge in USD.
      allOf:
        - $ref: "#/components/schemas/Price"
        - type: object
          required:
            - effectiveAt
          properties:
            amount:
              minimum: 50
            effectiveAt:
              type: string
              format: date-time
              description: >
                RFC 3339 date-time including its UTC offset, from which this
                price applies. A price stays in effect until the next entry's
                `effectiveAt`, at which point it gets replaced with that next entry.
              examples:
                - "2026-10-20T00:00:00-04:00"

    # A stored price schedule entry: a ScheduledPrice plus its identifier.
    AdminScheduledPrice:
      allOf:
        - $ref: "#/components/schemas/ScheduledPrice"
        - type: object
          required:
            - id
          properties:
            id:
              $ref: "#/components/schemas/PriceId"

    # A price entry in an update request. Without an `id` it is created;
    # with one it is matched to the stored entry.
    UpdateScheduledPrice:
      allOf:
        - $ref: "#/components/schemas/ScheduledPrice"
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/PriceId"

    CreateCourseRequest:
      description: All fields are required.
      allOf:
        - $ref: "#/components/schemas/CourseDetails"
        - type: object
          required:
            - prices
            - status
          properties:
            status:
              description: >
                Use `archived` to create
                the course hidden from the public API.
              default: published
              $ref: "#/components/schemas/CourseStatus"
            prices:
              type: array
              minItems: 1
              description: >
                Price schedule for the course. Each entry takes effect at its
                `effectiveAt`, which must be now or in the future. Entries may
                be sent in any order and may use different currencies;
                `effectiveAt` values must be unique. If every entry takes
                effect in the future, the course is hidden from `listCourses`
                and `getCourse` until the earliest `effectiveAt`.
              items:
                $ref: "#/components/schemas/ScheduledPrice"

    UpdateCourseRequest:
      description: >
        Full replacement of a course's details and price schedule. All
        fields are required except `id` on each price. `enrollmentCount` and
        the course `id` are read-only and ignored if sent.
      allOf:
        - $ref: "#/components/schemas/CourseDetails"
        - type: object
          required:
            - status
            - prices
          properties:
            status:
              $ref: "#/components/schemas/CourseStatus"
            prices:
              type: array
              minItems: 1
              description: >
                The complete price schedule after the update. Entries with an
                `id` are matched to stored entries, entries without one are
                created, and stored entries that are omitted are deleted.
                Entries already in effect must be included unchanged.
                `effectiveAt` values must be unique. Entries may be sent in
                any order.
              items:
                $ref: "#/components/schemas/UpdateScheduledPrice"

    Course:
      allOf:
        - $ref: "#/components/schemas/CourseDetails"
        - type: object
          required:
            - id
            - enrollmentCount
            - price
          properties:
            id:
              $ref: "#/components/schemas/CourseId"
            enrollmentCount:
              type: integer
              format: int32
              minimum: 0
              description: Number of users currently enrolled in the course.
              examples:
                - 12
            price:
              description: The course's currently active price.
              $ref: "#/components/schemas/Price"

    AdminCourse:
      description: >
        A course as seen by an administrator, including its current status,
        full price schedule, and enrolled customers with their payment details.
      allOf:
        - $ref: "#/components/schemas/CourseDetails"
        - type: object
          required:
            - id
            - status
            - enrollments
            - prices
          properties:
            id:
              $ref: "#/components/schemas/CourseId"
            status:
              $ref: "#/components/schemas/CourseStatusDetails"
            enrollments:
              type: array
              description: Enrolled customers and their associated payment details.
              items:
                $ref: "#/components/schemas/AdminEnrollment"
            prices:
              type: array
              minItems: 1
              description: >
                The course's full price schedule, ordered by effectiveAt
                ascending. The entry in effect now is the last one whose
                effectiveAt is in the past.
              items:
                $ref: "#/components/schemas/AdminScheduledPrice"

    AdminEnrollment:
      type: object
      required:
        - customer
        - payment
      properties:
        customer:
          type: object
          required:
            - id
            - name
            - email
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
        payment:
          type: object
          required:
            - status
            - amount
            - paidAt
          properties:
            status:
              type: string
              enum:
                - pending
                - succeeded
                - failed
                - refunded
            amount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
              description: Payment amount in the smallest unit of the currency.
            paidAt:
              type:
                - string
              format: date-time
              description: Time the payment succeeded, or null if not yet paid.

    # A price can never be deleted, only overwritten by a price with a later effectiveAt
    Price:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: >
            Price in the smallest unit of the currency. For USD, 9900
            represents $99.00.
          examples:
            - 9900
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: "^[A-Z]{3}$"
          examples:
            - USD

    CourseSchedule:
      type: object
      required:
        - startTime
        - endTime
        - timeZone
      properties:
        startTime:
          type: string
          format: date-time
          description: >
            Course start time as an RFC 3339 date-time including its UTC offset.
            Must be now or in the future when creating a course, or when
            changing it on update. The offset must match the offset `timeZone`
            observes at this instant.
          examples:
            - "2026-10-01T18:00:00-04:00"
        endTime:
          type: string
          format: date-time
          description: >
            Course end time as an RFC 3339 date-time including its UTC offset.
            Always after `startTime`. Must be in the future when creating a
            course, or when changing it on update. The offset must match the
            offset `timeZone` observes at this instant.
          examples:
            - "2026-10-01T20:00:00-04:00"
        timeZone:
          type: string
          description: >
            IANA time zone identifier the course is held in. Use this, rather
            than the UTC offset in `startTime` and `endTime`, to display local
            times correctly across daylight saving changes.
          examples:
            - America/New_York

    # RFC 9457 Problem Details, using only `title` and `detail` from the
    # standard members plus a `code` extension member. `type` is omitted
    # (defaults to about:blank); the HTTP status code is the source of truth
    # for status. Extension members are allowed, so no additionalProperties
    # restriction.
    ProblemDetails:
      type: object
      description: >
        Error response in the RFC 9457 Problem Details format. Clients should
        branch on `code`, not on `title` or `detail`. New codes may be added
        in future versions; clients should treat an unrecognized `code` as a
        generic error for the response's HTTP status.
      required:
        - title
        - detail
        - code
      properties:
        title:
          type: string
          description: Short, human-readable summary of the problem.
          examples:
            - Course not found
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        code:
          type: string
          description: Stable machine-readable error code.
          examples:
            - COURSE_NOT_FOUND

    ValidationProblemDetails:
      description: Problem Details with one entry per invalid field.
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required:
        - field
        - code
        - detail
      properties:
        field:
          type: string
          description: >
            JSON Pointer (RFC 6901) to the invalid field in the request body.
          examples:
            - /schedule/endTime
        code:
          type: string
          description: |
            Stable machine-readable code describing the rule that was
            violated. Codes are generic; use `field` to know which field
            failed. Current values:

            - `REQUIRED`: the field is missing or null.
            - `INVALID_TYPE`: the value has the wrong JSON type.
            - `INVALID_FORMAT`: the value is not in the expected format, such
              as a malformed date-time.
            - `INVALID_VALUE`: the value is well formed but not accepted, such
              as an unknown currency or time zone, or a UTC offset that does
              not match the course's time zone at that instant.
            - `TOO_SHORT`: the value is shorter than the minimum length.
            - `TOO_LONG`: the value is longer than the maximum length.
            - `BELOW_MINIMUM`: a number is below the minimum allowed.
            - `IN_PAST`: a date-time must be now or in the future.
            - `INVALID_RANGE`: the value is inconsistent with a related
              field, such as `endTime` not being after `startTime`.
            - `DUPLICATE_VALUE`: the value must be unique within its list.
            - `IMMUTABLE`: the entry is already in effect and cannot be
              changed. `field` points at the changed property, such as
              `/prices/1/amount`.
            - `MISSING_ENTRY`: an entry that is already in effect was omitted
              from the list. `field` is the list, such as `/prices`.
            - `UNKNOWN_ID`: the `id` does not match any entry of this course.

            Treat unrecognized values as a generic validation error.
          examples:
            - INVALID_RANGE
        detail:
          type: string
          description: Human-readable message suitable for display next to the field.