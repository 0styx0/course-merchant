openapi: 3.1.0

info:
  title: Course Merchant API
  version: 1.1.0
  description: API for browsing, creating, and purchasing courses.

servers:
  - url: http://localhost:3000/v1
    description: Local development server

# Operations are public unless they declare their own `security`.
security: []

tags:
  - name: Courses
    description: Public course operations
  - name: Admin
    description: Administrator-only operations
  - name: Checkout
    description: Buying a course
  - name: Webhooks
    description: >
      Called by third-party services, never by browsers or the web app. Each
      request is authenticated by the sender's signature rather than a login.

paths:
  /courses:
    get:
      tags:
        - Courses
      operationId: listCourses
      summary: List available courses
      description: >
        Returns publicly viewable courses that have not ended, ordered by start
        time ascending. A course is publicly viewable when its `status` is
        `published` and it has a currently active price. Archived courses and
        courses without a currently active price are not returned. A course
        whose prices all take effect in the future is hidden until the
        earliest `effectiveAt` is reached.
      responses:
        "200":
          description: Successfully retrieved available courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCoursesResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /courses/{courseId}:
    get:
      tags:
        - Courses
      operationId: getCourse
      summary: Get a course
      description: >
        Returns a course that is publicly viewable: its `status` is `published`
        and it has a currently active price. Unlike `listCourses`, ended courses
        are still returned. An archived course returns 404, as does a course
        whose prices all take effect in the future until the earliest
        `effectiveAt` is reached.
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Successfully retrieved the course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/InvalidCourseId"
        "404":
          $ref: "#/components/responses/CourseNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/courses:
    get:
      tags:
        - Admin
      operationId: listCoursesAsAdmin
      summary: List all courses as an administrator
      description: >
        Returns every course with its full price schedule. Requires an
        administrator.


        Unlike `listCourses`, nothing is filtered out: ended courses,
        archived courses, and courses without a currently active price
        (including those whose prices all take effect in the future) are all
        included. Courses are ordered by `schedule.startTime` descending,
        so the most recent and upcoming courses come first. Each course is in
        the same representation as `getCourseAsAdmin`, including its `status`.


        The response is not paginated.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successfully retrieved all courses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdminCoursesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Admin
      operationId: createCourse
      summary: Create a course
      description: >
        Creates a course. Requires an administrator.


        All fields are required. The server validates every
        field and reports all failures at once in the `errors` array of a 400
        response, so clients can display every problem together.


        Validation rules:

        - `name`: 1 to 100 characters.

        - `description`: 1 to 5,000 characters.

        - `schedule.timeZone`: must be a valid IANA time zone identifier.

        - `schedule.startTime`: must be an RFC 3339 date-time in UTC (ending
        in `Z`), and must be now or in the future.

        - `schedule.endTime`: must be an RFC 3339 date-time in UTC (ending in
        `Z`), in the future, and after `startTime`.

        - `prices`: at least one entry, and no two entries may share the same
        `effectiveAt`.

        - `contentUrl`: an absolute `http` or `https` URL, up to 2,048
        characters. It is sent to buyers and never shown publicly.

        - `prices[].currency`: must be a currency the store accepts. This is
        the Stripe account's payout currency, USD unless the server is
        configured otherwise, because charging in any other currency adds a
        conversion fee to every sale.

        - `prices[].amount`: either 0 (free) or at least 50 (fifty cents for
        USD), because the payment processor does not accept smaller charges.

        - `prices[].effectiveAt`: must be an RFC 3339 date-time in UTC (ending
        in `Z`), and must be now or in the future.

        - `status`: see #/components/schemas/CreateCourseStatus


        A course is publicly visible only when its `status` is `published` and
        a price is in effect. If every entry in `prices` has a future
        `effectiveAt`, the course is hidden from `listCourses` and `getCourse`
        until the earliest `effectiveAt`. Include a price with an `effectiveAt`
        of now to make the course visible immediately. Create a course with
        `status: archived` to keep it hidden, regardless of its prices, until
        it is published.


        The response is the same representation returned by
        `getCourseAsAdmin`: `prices` contains the full schedule, each entry
        with a generated `id`, ordered by `effectiveAt` ascending. Public
        course responses (`listCourses`, `getCourse`) instead return a single
        `price`, the currently active price, without `effectiveAt`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
            examples:
              reactFundamentals:
                value:
                  name: React Fundamentals
                  description: Learn the fundamentals of React.
                  contentUrl: https://drive.google.com/drive/folders/1a2b3c4d5e
                  status: published
                  prices:
                    - amount: 7900
                      currency: USD
                      effectiveAt: "2026-10-20T04:00:00Z"
                    - amount: 9900
                      currency: USD
                      effectiveAt: "2026-11-15T05:00:00Z"
                  schedule:
                    startTime: "2026-12-01T23:00:00Z"
                    endTime: "2026-12-02T01:00:00Z"
                    timeZone: America/New_York
      responses:
        "201":
          description: >
            Course created. The response is the full administrator view of
            the course, including every entry of the price schedule with its
            `id`.
          headers:
            Location:
              description: URL of the newly created course.
              schema:
                type: string
                format: uri-reference
              examples:
                - /v1/admin/courses/123e4567-e89b-12d3-a456-426614174000
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourse"
              examples:
                reactFundamentals:
                  value:
                    id: 123e4567-e89b-12d3-a456-426614174000
                    name: React Fundamentals
                    description: Learn the fundamentals of React.
                    contentUrl: https://drive.google.com/drive/folders/1a2b3c4d5e
                    status:
                      name: published
                      changedAt: "2026-10-15T18:30:00Z"
                    enrollments: []
                    prices:
                      - id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                        amount: 7900
                        currency: USD
                        effectiveAt: "2026-10-20T04:00:00Z"
                      - id: 0b7d3f52-3c1a-4a0e-9f0b-5d3f8a6b1c42
                        amount: 9900
                        currency: USD
                        effectiveAt: "2026-11-15T05:00:00Z"
                    schedule:
                      startTime: "2026-12-01T23:00:00Z"
                      endTime: "2026-12-02T01:00:00Z"
                      timeZone: America/New_York
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/courses/{courseId}:
    get:
      tags:
        - Admin
      operationId: getCourseAsAdmin
      summary: Get a course as an administrator
      description: >
        Returns a course with its full price schedule. Requires an
        administrator.


        Unlike `getCourse`, this returns the course regardless of whether it
        is publicly visible, including archived courses and courses whose
        prices all take effect in the future. It returns 404 only when no
        course exists with the given ID.


        The response includes the course's `status`. Instead of the single
        currently active `price`, it contains `prices`: every entry in the
        course's price schedule, ordered by
        `effectiveAt` ascending. Each entry has an `id`, and entries whose
        `effectiveAt` has passed are included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: Successfully retrieved the course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourse"
        "400":
          $ref: "#/components/responses/InvalidCourseId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AdminCourseNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Admin
      operationId: updateCourse
      summary: Update a course
      description: >
        Replaces a course's details, status and future price schedule.
        Requires an administrator.


        Send the representation returned by `getCourseAsAdmin`, minus the
        course `id`, `enrollments`, the `changedAt` of `status`, and the `id`
        of each price. The body is strict: unknown or read-only fields are
        rejected. Every field is required.


        Validation runs in two stages, each reporting all of its failures at
        once in the `errors` array of a 400 response. Format errors (types,
        lengths, date-time formats, currencies, `endTime` after `startTime`,
        duplicate `effectiveAt` values) are reported first. Only a well-formed
        request is then checked against the course's current state (past
        times, the resulting price schedule). The update is atomic: if any
        validation fails, nothing is changed.


        **Details.** `name`, `description`, `contentUrl` and `schedule`
        overwrite the stored values and follow the same rules as
        `createCourse`, except that the
        past-time checks apply only to values that changed:

        - `schedule.startTime` must be now or in the future only if it
        differs from the stored value.

        - `schedule.endTime` must be in the future only if it differs from
        the stored value.

        - `endTime` must always be after `startTime`.


        This lets an admin edit the description of a course that has already
        started. Times are compared as instants, at the microsecond precision
        the server stores.


        **Status.** `status` is required. When it differs from the course's
        current status, it is appended to the course's status history and
        `status.changedAt` is updated. Sending the current status changes
        nothing. Send `archived` to hide the course from the public API,
        `published` to make it publicly viewable again (once a price is in
        effect), or `deleted` to remove it from `listCoursesAsAdmin`.


        **Prices.** A stored price is in effect once its `effectiveAt` has
        passed, evaluated when the request is processed. In-effect prices can
        never be changed or deleted, since payments refer to them. `prices`
        is the course's complete future schedule:

        - An entry that exactly matches a stored price (same `effectiveAt`
        instant, `amount` and `currency`) is kept unchanged, including its
        `id`. This lets a form send back the schedule it loaded, and makes
        retries safe.

        - Every other entry is new and must have an `effectiveAt` that is now
        or in the future. Since in-effect prices are in the past, changing one
        is rejected with `IN_PAST`.

        - A stored price that is not yet in effect and has no exact match in
        `prices` is deleted. To change a future price, send it with its new
        `amount` or `currency`; it is replaced and gets a new `id`.

        - In-effect prices omitted from `prices` are kept.

        - No two entries may share the same `effectiveAt`.

        - The resulting schedule must not be empty. If no stored price is in
        effect, `prices` must contain at least one entry.


        The response is the updated course in the same representation as
        `getCourseAsAdmin`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
            examples:
              reactFundamentals:
                summary: Keep a past price, change a future one, add a new one
                value:
                  name: React Fundamentals
                  description: Learn the fundamentals of React, with hands-on labs.
                  contentUrl: https://drive.google.com/drive/folders/1a2b3c4d5e
                  status: published
                  prices:
                    - amount: 6900
                      currency: USD
                      effectiveAt: "2026-09-01T04:00:00Z"
                    - amount: 10900
                      currency: USD
                      effectiveAt: "2026-11-15T05:00:00Z"
                    - amount: 11900
                      currency: USD
                      effectiveAt: "2026-11-25T05:00:00Z"
                  schedule:
                    startTime: "2026-12-01T23:00:00Z"
                    endTime: "2026-12-02T01:00:00Z"
                    timeZone: America/New_York
      responses:
        "200":
          description: Course updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCourse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AdminCourseNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /checkout-sessions:
    post:
      tags:
        - Checkout
      operationId: startCheckout
      summary: Start buying a course
      description: >
        Starts a purchase for the buyer identified by `customer.email`. The price is
        always the course's current price as stored on the server.


        The response never reveals whether the email already owns the
        course. When `status` is `check_email`, an email has been queued
        for the buyer (unless the address has already received 5 emails in
        the last 24 hours, in which case nothing more is sent):

        - the buyer already has access: the email repeats their course link;

        - the buyer's access is suspended because of a payment dispute: the
        email asks them to contact the owner and contains no link;

        - the course is free: the buyer is enrolled immediately and the
        email contains their course link.


        Otherwise `status` is `redirect`, and the client sends the browser
        to `url`, the payment provider's hosted checkout page. Paying there
        does not grant access by itself; access is granted when the provider
        confirms the payment to the server. A buyer whose earlier purchase was
        fully refunded can buy the course again.


        The course must be publicly viewable (`getCourse` returns it) and must
        not have ended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCheckoutRequest"
            examples:
              buyer:
                value:
                  courseId: 123e4567-e89b-12d3-a456-426614174000
                  customer:
                    name: Ada Lovelace
                    email: ada@example.com
      responses:
        "200":
          description: >
            Checkout started. Both outcomes use the same status code so the
            response doesn't reveal whether the email owns the course.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartCheckoutResponse"
              examples:
                redirect:
                  value:
                    status: redirect
                    url: https://checkout.stripe.com/c/pay/cs_test_a1b2c3
                checkEmail:
                  value:
                    status: check_email
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/CourseNotFound"
        "409":
          $ref: "#/components/responses/CourseNotPurchasable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/PaymentProviderUnavailable"

  /checkout-sessions/{checkoutId}:
    get:
      tags:
        - Checkout
      operationId: getCheckoutStatus
      summary: Check how a checkout ended
      description: >
        Returns the state of a paid checkout, for the page the buyer returns
        to after paying. `checkoutId` is the payment provider's checkout
        identifier, which the provider places in the return URL.


        `pending` means the provider hasn't confirmed the payment to the
        server yet; poll again shortly. Once `succeeded`, the access email
        has been queued.
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: The checkout's current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutStatus"
              examples:
                pending:
                  value:
                    status: pending
        "404":
          $ref: "#/components/responses/CheckoutNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /webhooks/stripe:
    post:
      tags:
        - Webhooks
      operationId: receiveStripeEvent
      summary: Receive a payment event from Stripe
      description: >
        For Stripe only. Stripe calls this to report what happened to a
        checkout; it's how the server learns a payment succeeded, and the
        only way a paid enrollment is created.


        The `Stripe-Signature` header must be a valid signature of the exact
        request body, made with this endpoint's signing secret. Requests
        without one are rejected with 400.


        Handled event types:

        - `checkout.session.completed` with `payment_status` `paid`: the
        payment succeeds and the buyer is enrolled (or their refunded
        enrollment reactivated) and emailed their course link. If the buyer
        already has access, as when they paid twice in two tabs, the payment
        is refunded automatically instead.

        - `checkout.session.expired`: a payment still pending is marked
        `expired`.


        Other event types are acknowledged with 200 and ignored. Each event
        is processed at most once, so a repeated delivery returns 200 and
        changes nothing. A 500 means the event wasn't processed; Stripe
        retries it later.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Stripe's signature of the request body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                A Stripe Event object. Its shape is defined by Stripe; see
                Stripe's API reference for events.
      responses:
        "200":
          description: Event received, whether processed now, processed before, or ignored.
        "400":
          $ref: "#/components/responses/InvalidWebhookSignature"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token for an authenticated administrator.

  parameters:
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      description: The payment provider's checkout identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: cs_test_a1b2c3

    CourseId:
      name: courseId
      in: path
      required: true
      description: Public identifier of the course.
      schema:
        $ref: "#/components/schemas/CourseId"

  responses:
    ValidationFailed:
      description: >
        The request body failed validation. `errors` lists every failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetails"
          examples:
            validationFailed:
              value:
                title: Validation failed
                detail: The request contains 2 invalid fields.
                code: VALIDATION_FAILED
                errors:
                  - field: /prices/0/amount
                    code: BELOW_MINIMUM
                    detail: Price must either be free or cost at least 0.50.
                  - field: /schedule/endTime
                    code: INVALID_RANGE
                    detail: End time must be after start time.
            updateRejected:
              value:
                title: Validation failed
                detail: The request contains 2 invalid fields.
                code: VALIDATION_FAILED
                errors:
                  - field: /prices/0/effectiveAt
                    code: IN_PAST
                    detail: Price effective time cannot be in the past.
                  - field: /schedule/startTime
                    code: IN_PAST
                    detail: Start time cannot be in the past.

    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unauthorized:
              value:
                title: Unauthorized
                detail: Authentication is required.
                code: UNAUTHORIZED

    Forbidden:
      description: The authenticated user is not an administrator.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            forbidden:
              value:
                title: Forbidden
                detail: Administrator access is required.
                code: FORBIDDEN

    InvalidCourseId:
      description: The course identifier is malformed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            invalidCourseId:
              value:
                title: Invalid course ID
                detail: "'not-a-uuid' is not a valid course identifier."
                code: INVALID_COURSE_ID

    CourseNotFound:
      description: >
        Course not found, archived, or does not have a currently active price
        (including a course whose prices all take effect in the future).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notFound:
              value:
                title: Course not found
                detail: No course exists with ID 123e4567-e89b-12d3-a456-426614174000.
                code: COURSE_NOT_FOUND

    AdminCourseNotFound:
      description: No course exists with the given ID.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notFound:
              value:
                title: Course not found
                detail: No course exists with ID 123e4567-e89b-12d3-a456-426614174000.
                code: COURSE_NOT_FOUND

    CourseNotPurchasable:
      description: The course has ended and can no longer be bought.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            ended:
              value:
                title: Course not purchasable
                detail: This course has ended and can no longer be bought.
                code: COURSE_NOT_PURCHASABLE

    CheckoutNotFound:
      description: No checkout exists with the given identifier.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            notFound:
              value:
                title: Checkout not found
                detail: No checkout exists with ID cs_test_a1b2c3.
                code: CHECKOUT_NOT_FOUND

    TooManyRequests:
      description: Too many requests from this client. Retry after a short delay.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            tooMany:
              value:
                title: Too many requests
                detail: Too many checkout attempts. Try again in a minute.
                code: TOO_MANY_REQUESTS

    PaymentProviderUnavailable:
      description: The payment provider couldn't be reached. Retry later.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            unavailable:
              value:
                title: Payment provider unavailable
                detail: Payments can't be taken right now. Try again later.
                code: PAYMENT_PROVIDER_UNAVAILABLE

    InvalidWebhookSignature:
      description: The request's signature is missing or doesn't match its body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            invalidSignature:
              value:
                title: Invalid webhook signature
                detail: The Stripe-Signature header doesn't match the request body.
                code: INVALID_WEBHOOK_SIGNATURE

    InternalServerError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            internalServerError:
              value:
                title: Internal server error
                code: INTERNAL_SERVER_ERROR
                detail: ""

  schemas:
    StartCheckoutRequest:
      type: object
      additionalProperties: false
      required:
        - courseId
        - customer
      properties:
        courseId:
          $ref: "#/components/schemas/CourseId"
        customer:
          $ref: "#/components/schemas/CheckoutCustomer"

    CheckoutCustomer:
      description: The person buying the course.
      type: object
      additionalProperties: false
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: >
            The buyer's name, used in emails. Leading and trailing spaces are
            removed. An existing customer keeps the name they first gave.
          examples:
            - Ada Lovelace
        email:
          type: string
          format: email
          maxLength: 254
          description: >
            Where the course link is sent. Compared without regard to case,
            so `Ada@Example.com` and `ada@example.com` are the same buyer.
          examples:
            - ada@example.com

    StartCheckoutResponse:
      oneOf:
        - $ref: "#/components/schemas/CheckoutRedirect"
        - $ref: "#/components/schemas/CheckoutCheckEmail"
      discriminator:
        propertyName: status
        mapping:
          redirect: "#/components/schemas/CheckoutRedirect"
          check_email: "#/components/schemas/CheckoutCheckEmail"

    CheckoutRedirect:
      type: object
      required:
        - status
        - url
      properties:
        status:
          type: string
          const: redirect
        url:
          type: string
          format: uri
          description: The payment provider's hosted checkout page.

    CheckoutCheckEmail:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: check_email

    CheckoutStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - succeeded
            - expired
            - refunded
          description: >
            `expired` means the buyer didn't pay before the checkout timed out.
            `refunded` means the payment was later fully refunded.

    CourseId:
      type: string
      format: uuid
      description: Public identifier of the course.
      examples:
        - 123e4567-e89b-12d3-a456-426614174000

    PriceId:
      type: string
      format: uuid
      description: Identifier of an entry in a course's price schedule.
      examples:
        - 7c9e6679-7425-40de-944b-e07fc1f90ae7

    CourseStatusDetails:
      type: object
      required:
        - name
        - changedAt
      properties:
        name:
          $ref: "#/components/schemas/CourseStatus"
        changedAt:
          type: string
          format: date-time
          description: RFC 3339 date-time in UTC (ending in `Z`) when the status was last changed.
          examples:
            - "2026-10-15T18:30:00Z"

    # append-only log. the one with the most recent changedAt is the courses' current status
    CourseStatus:
      type: string
      enum:
        - published
        - archived
        - drafted
        - deleted
      description: >
        Whether an administrator has made the course available. `published`
        courses are publicly viewable once a price is in effect. `drafted`
        and `archived` courses are hidden from the public API regardless of
        their prices, and can be published at any time. `deleted` courses are
        also hidden from `listCoursesAsAdmin`; a course can only be deleted by
        updating it.
      examples:
        - published

    CreateCourseStatus:
      description: >
        A `CourseStatus` a course can be created with. Use `drafted` or
        `archived` to create the course hidden from the public API.
      type: string
      enum:
        - published
        - archived
        - drafted
      examples:
        - published

    ListCoursesResponse:
      type: object
      required:
        - courses
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"

    ListAdminCoursesResponse:
      type: object
      required:
        - courses
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/AdminCourse"

    CourseName:
      type: string
      minLength: 1
      maxLength: 100
      description: Public name of the course.
      examples:
        - React Fundamentals

    CourseDescription:
      type: string
      minLength: 1
      maxLength: 5000
      description: Public description of the course.
      examples:
        - Learn the fundamentals of React.

    CourseContentUrl:
      type: string
      format: uri
      maxLength: 2048
      description: >
        Private link to the course material, such as a Google Drive folder or
        a Zoom meeting. It is emailed to buyers and only ever returned to
        administrators.
      examples:
        - https://drive.google.com/drive/folders/1a2b3c4d5e

    # Fields common to the public and admin representations and to the
    # create and update requests. Validation limits live here once so they
    # cannot drift between operations.
    CourseDetails:
      type: object
      required:
        - name
        - description
        - schedule
      properties:
        name:
          $ref: "#/components/schemas/CourseName"
        description:
          $ref: "#/components/schemas/CourseDescription"
        schedule:
          $ref: "#/components/schemas/CourseSchedule"

    # A price that takes effect at a given time. Shared by every operation that
    # reads or writes a course's price schedule.
    ScheduledPrice:
      description: >
        A `Price` that takes effect at `effectiveAt`, with the additional
        constraint that the amount is either 0 (free) or at least 50, the
        payment processor's minimum charge in USD.
      allOf:
        - $ref: "#/components/schemas/Price"
        - type: object
          required:
            - effectiveAt
          properties:
            amount:
              anyOf:
                - const: 0
                - minimum: 50
            effectiveAt:
              type: string
              format: date-time
              description: >
                RFC 3339 date-time in UTC (ending in `Z`) from which this
                price applies. A price stays in effect until the next entry's
                `effectiveAt`, at which point it gets replaced with that next entry.
              examples:
                - "2026-10-20T04:00:00Z"

    # A stored price schedule entry: a ScheduledPrice plus its identifier.
    AdminScheduledPrice:
      allOf:
        - $ref: "#/components/schemas/ScheduledPrice"
        - type: object
          required:
            - id
          properties:
            id:
              $ref: "#/components/schemas/PriceId"

    CreateCourseRequest:
      description: All fields are required.
      allOf:
        - $ref: "#/components/schemas/CourseDetails"
        - type: object
          required:
            - contentUrl
            - prices
            - status
          properties:
            contentUrl:
              $ref: "#/components/schemas/CourseContentUrl"
            status:
              $ref: "#/components/schemas/CreateCourseStatus"
            prices:
              type: array
              minItems: 1
              description: >
                Price schedule for the course. Each entry takes effect at its
                `effectiveAt`, which must be now or in the future. Entries may
                be sent in any order and may use different currencies;
                `effectiveAt` values must be unique. If every entry takes
                effect in the future, the course is hidden from `listCourses`
                and `getCourse` until the earliest `effectiveAt`.
              items:
                $ref: "#/components/schemas/ScheduledPrice"

    UpdateCourseRequest:
      description: >
        Full replacement of a course's details, status and future price
        schedule. All fields are required, and unknown fields are rejected.
      allOf:
        - $ref: "#/components/schemas/CourseDetails"
        - type: object
          required:
            - contentUrl
            - status
            - prices
          properties:
            contentUrl:
              $ref: "#/components/schemas/CourseContentUrl"
            status:
              $ref: "#/components/schemas/CourseStatus"
            prices:
              type: array
              minItems: 0
              description: >
                The complete future price schedule after the update. Entries
                that exactly match a stored price are kept; every other entry
                is created and must take effect now or in the future. Stored
                prices not yet in effect without an exact match are deleted.
                Prices already in effect are always kept and may be omitted.
                `effectiveAt` values must be unique. Entries may be sent in
                any order. Must contain at least one entry if no stored price
                is in effect.
              items:
                $ref: "#/components/schemas/ScheduledPrice"

    Course:
      allOf:
        - $ref: "#/components/schemas/CourseDetails"
        - type: object
          required:
            - id
            - enrollmentCount
            - price
          properties:
            id:
              $ref: "#/components/schemas/CourseId"
            enrollmentCount:
              type: integer
              format: int32
              minimum: 0
              description: Number of users currently enrolled in the course.
              examples:
                - 12
            price:
              description: The course's currently active price.
              $ref: "#/components/schemas/Price"

    AdminCourse:
      description: >
        A course as seen by an administrator, including its current status,
        full price schedule, and enrolled customers with their payment details.
      allOf:
        - $ref: "#/components/schemas/CourseDetails"
        - type: object
          required:
            - id
            - contentUrl
            - status
            - enrollments
            - prices
          properties:
            id:
              $ref: "#/components/schemas/CourseId"
            contentUrl:
              $ref: "#/components/schemas/CourseContentUrl"
            status:
              $ref: "#/components/schemas/CourseStatusDetails"
            enrollments:
              type: array
              description: Enrolled customers and their associated payment details.
              items:
                $ref: "#/components/schemas/AdminEnrollment"
            prices:
              type: array
              minItems: 1
              description: >
                The course's full price schedule, ordered by effectiveAt
                ascending. The entry in effect now is the last one whose
                effectiveAt is in the past.
              items:
                $ref: "#/components/schemas/AdminScheduledPrice"

    AdminEnrollment:
      description: >
        A customer's enrollment. It gives access only while both `revokedAt`
        and `suspendedAt` are null.
      type: object
      required:
        - customer
        - payment
        - revokedAt
        - suspendedAt
        - emailStatus
      properties:
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
          description: >
            When a full refund removed access, in UTC. Cleared if the customer
            buys the course again.
        suspendedAt:
          type:
            - string
            - "null"
          format: date-time
          description: >
            When a payment dispute suspended access, in UTC. Cleared by hand
            by the owner.
        emailStatus:
          type: string
          enum:
            - pending
            - sent
            - failed
          description: >
            Delivery status of the latest email sent to the customer about this
            course. `failed` means every send attempt failed, and is also
            returned when no email was ever queued, so the owner can follow up.
        customer:
          type: object
          required:
            - id
            - name
            - email
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
        payment:
          description: The payment behind the enrollment, or null for a free course.
          type:
            - object
            - "null"
          required:
            - status
            - amount
            - paidAt
          properties:
            status:
              type: string
              enum:
                - pending
                - succeeded
                - expired
                - refunded
            amount:
              type: integer
              format: int64
              minimum: 0
              maximum: 9007199254740991
              description: Payment amount in the smallest unit of the currency.
            paidAt:
              type:
                - string
                - "null"
              format: date-time
              description: >
                Time the payment succeeded, in UTC (ending in `Z`). Customers
                are only enrolled once their payment succeeds, so this is set
                for every enrollment.

    # A price in effect can never be changed or deleted, only overwritten by a price with a later effectiveAt.
    # A price not yet in effect can be replaced or deleted.
    Price:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: >
            Price in the smallest unit of the currency. For USD, 9900
            represents $99.00.
          examples:
            - 9900
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: "^[A-Z]{3}$"
          examples:
            - USD

    CourseSchedule:
      type: object
      required:
        - startTime
        - endTime
        - timeZone
      properties:
        startTime:
          type: string
          format: date-time
          description: >
            Course start time as an RFC 3339 date-time in UTC (ending in `Z`).
            Must be now or in the future when creating a course, or when
            changing it on update.
          examples:
            - "2026-10-01T22:00:00Z"
        endTime:
          type: string
          format: date-time
          description: >
            Course end time as an RFC 3339 date-time in UTC (ending in `Z`).
            Always after `startTime`. Must be in the future when creating a
            course, or when changing it on update.
          examples:
            - "2026-10-02T00:00:00Z"
        timeZone:
          type: string
          description: >
            IANA time zone identifier the course is held in. `startTime` and
            `endTime` are always in UTC; use this to display them in local
            time, correctly across daylight saving changes.
            Using separate field instead of relying on UTC in cases where people travel
              to the course location
          examples:
            - America/New_York

    # RFC 9457 Problem Details, using only `title` and `detail` from the
    # standard members plus a `code` extension member. `type` is omitted
    # (defaults to about:blank); the HTTP status code is the source of truth
    # for status. Extension members are allowed, so no additionalProperties
    # restriction.
    ProblemDetails:
      type: object
      description: >
        Error response in the RFC 9457 Problem Details format. Clients should
        branch on `code`, not on `title` or `detail`. New codes may be added
        in future versions; clients should treat an unrecognized `code` as a
        generic error for the response's HTTP status.
      required:
        - title
        - detail
        - code
      properties:
        title:
          type: string
          description: Short, human-readable summary of the problem.
          examples:
            - Course not found
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        code:
          type: string
          description: Stable machine-readable error code.
          examples:
            - COURSE_NOT_FOUND

    ValidationProblemDetails:
      description: Problem Details with one entry per invalid field.
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required:
        - field
        - code
        - detail
      properties:
        field:
          type: string
          description: >
            JSON Pointer (RFC 6901) to the invalid field in the request body.
          examples:
            - /schedule/endTime
        code:
          type: string
          description: |
            Stable machine-readable code describing the rule that was
            violated. Codes are generic; use `field` to know which field
            failed. Current values:

            - `REQUIRED`: the field is missing or null.
            - `INVALID_TYPE`: the value has the wrong JSON type.
            - `INVALID_FORMAT`: the value is not in the expected format, such
              as a malformed date-time or one that is not in UTC.
            - `INVALID_VALUE`: the value is well formed but not accepted, such
              as an unknown currency, time zone or status.
            - `TOO_SHORT`: a string is shorter than the minimum length, or a
              list has fewer entries than the minimum.
            - `TOO_LONG`: a string is longer than the maximum length, or a
              list has more entries than the maximum.
            - `BELOW_MINIMUM`: a number is below the minimum allowed.
            - `ABOVE_MAXIMUM`: a number is above the maximum allowed.
            - `IN_PAST`: a date-time must be now or in the future.
            - `INVALID_RANGE`: the value is inconsistent with a related
              field, such as `endTime` not being after `startTime`.
            - `DUPLICATE_VALUE`: the value must be unique within its list.
            - `UNKNOWN_FIELD`: the field is not part of the request. `field`
              points at the unknown field.

            Treat unrecognized values as a generic validation error.
          examples:
            - INVALID_RANGE
        detail:
          type: string
          description: Human-readable message suitable for display next to the field.
