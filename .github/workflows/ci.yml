name: CI

# Runs what the git hooks run (see .husky/), so a passing badge means the
# type checks and all test suites pass on a clean machine. Each job is one
# kind of check, so a pull request lists one pill per kind.
on:
  pull_request:
  push:
    branches: [main]

# The default token can only read the repo. No secrets are used: the tests run
# against the fake values in api/.env.test.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-scripts:
    name: Repo script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sh .husky/check-folder-file-count.sh
      - run: bash .husky/check-folder-file-count.test.sh
      - run: bash .claude/hooks/lint-design-doc.test.sh
      - run: bash .claude/skills/usage-review/measure.test.sh

  api-checks:
    name: API static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-node-deps
        with:
          project: api
      - name: Generated API types are up to date
        run: |
          yarn generate:api-types
          git diff --exit-code -- src/generated
      - run: yarn tsc --noEmit
      - run: yarn lint
      - run: yarn knip
      - run: yarn format:check
      - run: yarn build

  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-node-deps
        with:
          project: api
      - run: yarn test:unit

  # The integration and e2e jobs start Postgres and stripe-mock themselves
  # (docker compose).
  api-integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-node-deps
        with:
          project: api
      - run: yarn test:integration

  api-e2e:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-node-deps
        with:
          project: api
      - run: yarn test:e2e

  web-checks:
    name: Web static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-node-deps
        with:
          project: web
      - name: Generated API types are up to date
        run: |
          yarn generate:api-types
          git diff --exit-code -- src/lib/api/generated.ts
      # Next generates the global PageProps/LayoutProps types into .next/
      # (gitignored), so a clean checkout needs this before the type check.
      - run: yarn next typegen
      - run: yarn tsc --noEmit
      - run: yarn lint
      - run: yarn knip
      - run: yarn format:check

  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-node-deps
        with:
          project: web
      - run: yarn test:unit

  web-browser:
    name: Web browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-node-deps
        with:
          project: web
      # Headless runs need only the smaller headless shell, not full Chrome.
      - run: yarn playwright install --with-deps --only-shell chromium
      - run: yarn test:browser
      # A trace shows each step, page load, request and console line of a failed test.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
